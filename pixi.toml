[workspace]
name = "capcruncher"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# conda packages — binary tools that cannot be pip-installed
[dependencies]
python        = ">=3.12,<3.14"
bedtools      = ">=2.31,<3"
bowtie2       = ">=2.5,<3"
coreutils     = "*"
fastqc        = ">=0.12,<1"
flash2        = "*"
pigz          = ">=2,<3"
pybigtools    = ">=0.2.5"
pysam         = ">=0.23,<1"
samtools      = ">=1.6,<2"
trim-galore   = ">=0.6,<1"
ucsc-bedgraphtobigwig = ">=482"
ucsc-bedtobigbed      = ">=482"

# Python packages
[pypi-dependencies]
biopython         = ">=1.83,<2"
click             = ">=8,<9"
cookiecutter      = "<=2.1.1"
cooler            = ">=0.10,<1"
h5py              = ">=3.16.0"
joblib            = ">=1,<2"
loguru            = ">=0.7,<1"
matplotlib        = ">=3.10.9"
multiqc           = ">=1.35"
numpy             = ">=2.4,<3.0"
pandas            = ">=2.2,<3.0"
pandera           = ">=0.31,<1"
plotly            = ">=6,<7"
polars            = ">=1.39,<1.42"
pyarrow           = ">=24,<25"
pydeseq2          = ">=0.5.4,<0.6"
pydantic          = ">=2.13,<3"
pyranges1         = ">=1.3,<2"
pyyaml            = ">=6,<7"
snakemake         = ">=9.21,<10"
tomli-w           = ">=0.4.0"
tqdm              = ">=4,<5"
typer             = ">=0.16,<1"
xopen             = ">=2.0.2"
xxhash            = ">=3,<4"
capcruncher-tools = ">=0.2.4,<0.3.0"
plotnado          = {version = ">=0.3,<0.4", extras = ["toml"]}
tracknado         = ">=0.3.1,<0.4.0"

[feature.test.pypi-dependencies]
pytest       = ">=8.4.2"
pytest-cov   = ">=6.3.0"
pytest-order = ">=0.11.0"
pytest-xdist = ">=3.8.0"
capcruncher  = {path = ".", editable = true, extras = ["full", "config", "plot", "differential"]}

[environments]
default = {solve-group = "default"}
test    = {features = ["test"], solve-group = "default"}

[feature.test.tasks]
test          = "pytest -vv -s --log-cli-level info -n 4 -m 'not pipeline'"
test-pipeline = "pytest -vv -s --log-cli-level info -n 4 --cov-append -m pipeline --cores 4"
test-all      = "pytest -vv -s --log-cli-level info -n 4 --cores 4"
