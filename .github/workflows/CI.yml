name: CI

on:
  pull_request:
    branches: [develop, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: lint

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: typecheck

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run ty
        run: uv run ty check

  bowtie2-index:
    name: Prepare Bowtie2 index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Bowtie2
        run: |
          sudo apt-get update
          sudo apt-get install --yes bowtie2

      - name: Detect Bowtie2 version
        id: bowtie2-version
        run: |
          bowtie2 --version
          version="$(bowtie2 --version | awk 'NR == 1 { print $NF }')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore Bowtie2 index cache
        id: bowtie2-cache
        uses: actions/cache@v4
        with:
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/*.bt2
          key: bowtie2-index-${{ steps.bowtie2-version.outputs.version }}-${{ hashFiles('tests/data/data_for_pipeline_run/chr14.fa.gz') }}

      - name: Build Bowtie2 index
        if: steps.bowtie2-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tests/data/data_for_pipeline_run/chr14_bowtie2_indicies
          bowtie2-build \
            tests/data/data_for_pipeline_run/chr14.fa.gz \
            tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/bt2 \
            --threads 4

      - name: Upload Bowtie2 index artifact
        uses: actions/upload-artifact@v4
        with:
          name: chr14-bowtie2-index
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/*.bt2
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.name }})
    needs: bowtie2-index
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            run_pipeline: true
            upload_coverage: true
          - name: macos
            os: macos-13
            run_pipeline: false
            upload_coverage: false

    steps:
      - uses: actions/checkout@v4

      - name: Download Bowtie2 index
        uses: actions/download-artifact@v4
        with:
          name: chr14-bowtie2-index
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true
          environments: test

      - name: Smoke-test install
        run: pixi run -e test python -c "import polars, pydeseq2, capcruncher_tools, plotnado; print(f'polars {polars.__version__}')"

      - name: Test quick suite
        run: pixi run -e test pytest -vv -s --log-cli-level info -n auto -m "not pipeline"

      - name: Test pipeline suite
        if: matrix.run_pipeline
        run: pixi run -e test pytest -vv -s --log-cli-level info -n auto --cov-append -m "pipeline"

      - name: Upload Coverage to Codecov
        if: matrix.upload_coverage
        uses: codecov/codecov-action@v5
        with:
          env_vars: OS,PYTHON
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: package
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capcruncher-dist
          path: dist/*
          if-no-files-found: error
