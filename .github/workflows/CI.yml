name: CI

on:
  pull_request:
    branches: [develop, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_VERSION: 1

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev

      - name: Restore bowtie2 cache
        uses: actions/cache@v4
        with:
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/*.bt2
          key: bowtie2-${{ runner.os }}-${{ env.CACHE_VERSION }}
        id: bowtie2_cache

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}
          cache-downloads: true
          cache-downloads-key: micromamba-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}
          post-cleanup: all

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: tests
          python-version: "3.12"

      - name: Check installed packages
        run: |
          micromamba info
          python --version
          uv --version

      - name: Install the package
        run: |
          uv pip install --system ".[full,config,plot]"
          uv pip install --system pytest-cov pytest-order pytest-xdist

      - name: Test quick suite with pytest
        run: |
          pytest -vv -s --log-cli-level info --cov=./ --cov-report=xml --cores 4 -m "not pipeline"

      - name: Test pipeline suite with pytest
        run: |
          pytest -vv -s --log-cli-level info --cov=./ --cov-append --cov-report=xml --cores 4 -m "pipeline"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          env_vars: OS,PYTHON
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: package
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capcruncher-dist
          path: dist/*
          if-no-files-found: error
