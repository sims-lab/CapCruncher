name: CI

on:
  pull_request:
    branches: [develop, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_VERSION: 3

jobs:
  bowtie2-index:
    name: Prepare Bowtie2 index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Bowtie2
        run: |
          sudo apt-get update
          sudo apt-get install --yes bowtie2

      - name: Detect Bowtie2 version
        id: bowtie2-version
        run: |
          bowtie2 --version
          version="$(bowtie2 --version | awk 'NR == 1 { print $NF }')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore Bowtie2 index cache
        id: bowtie2-cache
        uses: actions/cache@v4
        with:
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/*.bt2
          # Rebuild only when the test FASTA or Bowtie2 index format changes.
          key: bowtie2-index-${{ steps.bowtie2-version.outputs.version }}-${{ hashFiles('tests/data/data_for_pipeline_run/chr14.fa.gz') }}

      - name: Build Bowtie2 index
        if: steps.bowtie2-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tests/data/data_for_pipeline_run/chr14_bowtie2_indicies
          bowtie2-build \
            tests/data/data_for_pipeline_run/chr14.fa.gz \
            tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/bt2 \
            --threads 4

      - name: Upload Bowtie2 index artifact
        uses: actions/upload-artifact@v4
        with:
          name: chr14-bowtie2-index
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies/*.bt2
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.name }})
    needs: bowtie2-index
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            run_pipeline: true
            upload_coverage: true
          - name: macos
            os: macos-13
            run_pipeline: false
            upload_coverage: false

    steps:
      - uses: actions/checkout@v6

      - name: Download Bowtie2 index
        uses: actions/download-artifact@v4
        with:
          name: chr14-bowtie2-index
          path: tests/data/data_for_pipeline_run/chr14_bowtie2_indicies

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}
          cache-downloads: true
          cache-downloads-key: micromamba-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}
          post-cleanup: all

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: tests-${{ matrix.name }}
          python-version: "3.12"

      - name: Check installed packages
        run: |
          micromamba info
          python --version
          uv --version

      - name: Install the package
        run: |
          uv pip install --system --no-deps ".[full,config,plot]"
          uv pip install --system --no-deps "capcruncher-tools>=0.2.4,<0.3.0" "plotnado[toml]>=0.3,<0.4"
          uv pip install --system pytest-cov pytest-order pytest-xdist
          python -c "import polars, scipy.optimize, pydeseq2, capcruncher_tools, plotnado; print(f'polars {polars.__version__}')"

      - name: Test quick suite with pytest
        run: |
          pytest -vv -s --log-cli-level info --cov=./ --cov-report=xml --cores 4 -m "not pipeline"

      - name: Test pipeline suite with pytest
        if: matrix.run_pipeline
        run: |
          pytest -vv -s --log-cli-level info --cov=./ --cov-append --cov-report=xml --cores 4 -m "pipeline"

      - name: Upload Coverage to Codecov
        if: matrix.upload_coverage
        uses: codecov/codecov-action@v5
        with:
          env_vars: OS,PYTHON
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: package
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capcruncher-dist
          path: dist/*
          if-no-files-found: error
